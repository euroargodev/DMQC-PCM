[project]
name = "delayed-mode-ocean-quality-assessment-tool"
version = "0.1.0"
description = "The quality assessment method in the Southern Ocean (SO) uses the pre-classified core Argo float and climatological data belonging to similar water mass regimes using the Profile Characterisation Model (PCM)."
authors = [
    {name = "Kamila Walicka (kamwal@noc.ac.uk), Clive Neil (clive.neil@noc.ac.uk)"}
]
license = {text = "GPL-3.0-only"}
readme = "README.md"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "DMQC-PCM-Python" }]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

numpy = ">=1.26,<2.0"
cftime = ">=1.6.4.post1"
pandas = ">=2.1.0"             # compatible with NumPy 2
xarray = ">=2024.05.0"
dask = ">=2024.5.0"
toolz = ">=0.12.0"
erddapy = ">=1.2.0"
fsspec = ">=2023.10.0"
gsw = ">=3.6.0"
aiohttp = ">=3.9.0"
packaging = ">=23.0"
matplotlib = ">=3.8.0"
cartopy = ">=0.22.0"
seaborn = ">=0.13.0"
bottleneck = ">=1.3.6"          # fix the pandas warning
scipy = "^1.10.1"
pymatreader = "^1.2.2"
argopy = "^1.4.0"

# pyproject.toml
pyxpcm = {git = "https://github.com/obidam/pyxpcm.git"}
scikit-learn = ">=1.2.1,<1.6"
netcdf4 = ">=1.5.8"
